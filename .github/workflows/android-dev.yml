name: Build dev APK without automatic capture

on:
  push:
    branches: [dev]
    paths: ['android/**', 'scripts/make_update_manifest.py', 'scripts/verify_dev_capture_removed.py', '.github/workflows/android-dev.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-dev-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_UPDATE_KEYSTORE: ${{ github.workspace }}/android/build/signing/debug.keystore
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Choose dev version
        id: version
        run: |
          CODE=$((1000000 + GITHUB_RUN_NUMBER * 100 + GITHUB_RUN_ATTEMPT))
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "name=0.5.2-dev.$CODE" >> "$GITHUB_OUTPUT"
      - name: Install Android SDK components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36.1' 'build-tools;36.1.0'
      - name: Restore existing signing identity
        env:
          SIGNING_KEY: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          python3 - <<'PY'
          import os,base64
          from pathlib import Path
          secret=os.environ['SIGNING_KEY'].strip()
          if not secret:raise SystemExit('Missing ANDROID_DEBUG_KEYSTORE_BASE64')
          path=Path(os.environ['ANDROID_UPDATE_KEYSTORE'])
          path.parent.mkdir(parents=True,exist_ok=True)
          path.write_bytes(base64.b64decode(secret,validate=True))
          path.chmod(0o600)
          PY
      - name: Build, unit test and lint dev
        working-directory: android
        env:
          CODE: ${{ steps.version.outputs.code }}
          NAME: ${{ steps.version.outputs.name }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDevDebug :app:testDevDebugUnitTest :app:lintDevDebug "-PappVersionCode=$CODE" "-PappVersionName=$NAME"
      - name: Verify capture removal and signing identity
        env:
          CODE: ${{ steps.version.outputs.code }}
          NAME: ${{ steps.version.outputs.name }}
          RELEASE_NOTES: 'Dev: manual SMS scans restored; improved HDFC/Union bank classification, amount extraction and review filtering. OTPs, promotions, balance alerts, failed/pending payments and reminders are skipped. Automatic SMS/GPay capture remains disabled. READ_SMS can still trigger Play Protect installation checks. Update existing Dev installation without uninstalling to retain data.'
        run: |
          mkdir -p android/build/release
          APK="android/build/release/expense-dev-$CODE.apk"
          cp android/app/build/outputs/apk/dev/debug/app-dev-debug.apk "$APK"
          python3 scripts/verify_dev_capture_removed.py "$APK"
          python3 scripts/make_update_manifest.py --apk "$APK" --channel dev --version-code "$CODE" --version-name "$NAME" --output android/build/release/update-dev.json
          printf '%s' "$RELEASE_NOTES" > android/build/release/notes.md
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: expense-dev-${{ steps.version.outputs.code }}
          path: |
            android/build/release/*.apk
            android/build/release/update-dev.json
      - name: Publish downloadable dev prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          CODE: ${{ steps.version.outputs.code }}
        run: |
          TAG="android-dev-v$CODE"
          gh release create "$TAG" "android/build/release/expense-dev-$CODE.apk" android/build/release/update-dev.json --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Expense Dev $CODE - manual capture" --notes-file android/build/release/notes.md --prerelease --draft
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
