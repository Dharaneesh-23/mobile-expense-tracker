name: Build and publish private Android update

on:
  push:
    branches: [QA, prod]
    paths: ['android/**', 'scripts/make_update_manifest.py', '.github/workflows/android-update.yml']
  workflow_dispatch:
    inputs:
      channel:
        description: App update channel (builds its matching branch)
        required: true
        type: choice
        options: [qa, prod]
      notes:
        description: Changes shown inside the app
        type: string
        default: Personal-use app update

permissions:
  contents: write

concurrency:
  group: android-update-${{ github.event_name == 'workflow_dispatch' && inputs.channel || (github.ref_name == 'QA' && 'qa' || 'prod') }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Select the channel and monotonically increasing version
        id: version
        env:
          EVENT: ${{ github.event_name }}
          INPUT_CHANNEL: ${{ inputs.channel }}
          BRANCH: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os
          channel=os.environ['INPUT_CHANNEL'] if os.environ['EVENT']=='workflow_dispatch' else ('qa' if os.environ['BRANCH']=='QA' else 'prod')
          if channel not in ('qa','prod'):raise SystemExit('Unsupported channel')
          attempt=int(os.environ['GITHUB_RUN_ATTEMPT'])
          if not 1<=attempt<=99:raise SystemExit('Create a new run after 99 attempts')
          code=100000+int(os.environ['GITHUB_RUN_NUMBER'])*100+attempt
          if not 100<code<=2100000000:raise SystemExit('Invalid Android version code')
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
              out.write(f'channel={channel}\nref={"QA" if channel=="qa" else "prod"}\ncode={code}\nname=0.3.0-{channel}.{code}\n')
          PY
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.version.outputs.ref }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install the Android SDK components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36.1' 'build-tools;36.1.0'
      - name: Restore the existing personal-use signing key
        env:
          SIGNING_KEY: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          python3 - <<'PY'
          import os,base64
          from pathlib import Path
          secret=os.environ['SIGNING_KEY'].strip()
          if not secret:raise SystemExit('Configure ANDROID_DEBUG_KEYSTORE_BASE64 before building updates')
          path=Path.home()/'.android/debug.keystore'
          path.parent.mkdir(parents=True,exist_ok=True)
          path.write_bytes(base64.b64decode(secret,validate=True))
          path.chmod(0o600)
          PY
      - name: Build and test the APK
        working-directory: android
        env:
          CHANNEL: ${{ steps.version.outputs.channel }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          chmod +x gradlew
          VARIANT="${CHANNEL^}Debug"
          ./gradlew --no-daemon ":app:assemble$VARIANT" ":app:test${VARIANT}UnitTest" ":app:lint$VARIANT" "-PappVersionCode=$VERSION_CODE" "-PappVersionName=$VERSION_NAME"
      - name: Verify APK and produce its manifest
        env:
          CHANNEL: ${{ steps.version.outputs.channel }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          RELEASE_NOTES: ${{ inputs.notes || github.event.head_commit.message || 'Personal-use app update' }}
        run: |
          mkdir -p android/build/release
          APK="android/build/release/expense-$CHANNEL-$VERSION_CODE.apk"
          cp "android/app/build/outputs/apk/$CHANNEL/debug/app-$CHANNEL-debug.apk" "$APK"
          "$ANDROID_HOME/build-tools/36.1.0/apksigner" verify "$APK"
          python3 scripts/make_update_manifest.py --apk "$APK" --channel "$CHANNEL" --version-code "$VERSION_CODE" --version-name "$VERSION_NAME" --output "android/build/release/update-$CHANNEL.json"
          printf '%s' "$RELEASE_NOTES" > android/build/release/notes.md
      - name: Publish a complete immutable private release
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ steps.version.outputs.channel }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          TAG="android-$CHANNEL-v$VERSION_CODE"
          EXTRA=()
          if [ "$CHANNEL" = qa ]; then EXTRA+=(--prerelease); fi
          gh release create "$TAG" "android/build/release/expense-$CHANNEL-$VERSION_CODE.apk" "android/build/release/update-$CHANNEL.json" --repo "$GITHUB_REPOSITORY" --target "$(git rev-parse HEAD)" --title "Android $CHANNEL $VERSION_CODE" --notes-file android/build/release/notes.md --draft "${EXTRA[@]}"
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
